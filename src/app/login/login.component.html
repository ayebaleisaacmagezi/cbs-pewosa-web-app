<div class="login-wrapper cbs-login">
  <div class="login-panel">
    <main class="login-card-container">
      <section class="login-card" aria-labelledby="login-heading">
        <div class="logo-section">
          <img
            src="assets/images/cbs_pewosa_sacco-bgtrans.png"
            [alt]="'CBS PEWOSA SACCO logo' | translate"
            class="logo-image"
          />
          <h1 id="login-heading" class="login-heading">{{ 'Welcome to CBS PEWOSA' | translate }}</h1>
          <p class="login-subheading">{{ 'Sign in to continue' | translate }}</p>
        </div>

        <div class="form-section">
          @if (showTenantSelector) {
            <div class="tenant-section">
              <mifosx-tenant-selector></mifosx-tenant-selector>
            </div>
          }

          @if (!resetPassword && !twoFactorAuthenticationRequired) {
            <mifosx-login-form></mifosx-login-form>
          }

          @if (resetPassword) {
            <mifosx-reset-password></mifosx-reset-password>
          }

          @if (twoFactorAuthenticationRequired) {
            <mifosx-two-factor-authentication></mifosx-two-factor-authentication>
          }
        </div>
      </section>

      <div class="login-footer">
        <button
          mat-icon-button
          (click)="reloadSettings()"
          class="reload-button"
          title="Reload Settings"
          matTooltip="Reload Settings"
          attr.aria-label="Reload Settings"
        >
          <svg class="reload-icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h8V3l-3.35 3.35Z" />
          </svg>
        </button>
      </div>
    </main>
  </div>
</div>
